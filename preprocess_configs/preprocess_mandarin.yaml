dataset: "Mandarin"

speakers: ["RenSheng"]

path:
  lexicon_path: "./forced_alignment/dictionary/pinyin-lexicon-r.txt"
  audio_path: "./forced_alignment/speech_corpus_sentences"
  text_path: "./forced_alignment/speech_corpus_sentences"
  textgrid_path: "./forced_alignment/aligned_sentences"
  preprocessed_path: "./preprocessed_data_mandarin"
  train_files_path: "./train_files"

preprocessing:
  val_size: 8
  text:
    text_cleaners: []
    language: "mandarin"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
